; Example for an already-native 1366x768 game build.
; This compatibility layer does not itself widen the game viewport.
[ddraw]
width=1366
height=768
windowed=false
fullscreen=false
renderer=direct3d9
nonexclusive=true
adjmouse=true
maintas=true
boxing=false
refresh_rate=60
maxfps=60
resizable=false
savesettings=0
